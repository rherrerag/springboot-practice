# H2 en memoria - se reinicia cada vez que se levanta la app.
# No necesita instalacion: Spring Boot la levanta sola.
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema a partir de las entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (http://localhost:8080/h2-console) - solo para inspeccionar datos en dev
spring.h2.console.enabled=true
